name = "TrustExtractor"
version = "0.1.0"
defaultTargets = ["trust-extract"]

# Dependency analysis: the notions of dependency (statement, meaning, term) come from here.
[[require]]
name = "MeaningGraph"
git = "https://github.com/LeanTrustBuilders/meaning-graph"
# `main` follows the newest toolchain; branches `lean-v<toolchain>` carry the same code for older ones.
rev = "lean-v4.34.0"

[[require]]
name = "semantic_hash"
git = "https://github.com/mathlib-initiative/semantic_hash"
rev = "0496f6d7b650cb03c9ffc61089ffd400dfd98564"

[[require]]
name = "TrustAnnotations"
git = "https://github.com/LeanTrustBuilders/annotations"
# Like MeaningGraph: `main` follows the newest toolchain, `lean-v<toolchain>` older ones.
rev = "lean-v4.34.0"

[[lean_lib]]
name = "TrustExtractor"

[[lean_exe]]
name = "trust-extract"
root = "Main"
supportInterpreter = true
