name = "TrustExtractor"
version = "0.1.0"
defaultTargets = ["trust-extract"]

# Dependency analysis: the notions of dependency (statement, meaning, term), and the three hashes
# (meaning, local, content), come from here.
[[require]]
name = "MeaningGraph"
git = "https://github.com/LeanTrustBuilders/meaning-graph"
# `main` follows the newest toolchain; branches `lean-v<toolchain>` carry the same code for older ones.
rev = "main"

[[require]]
name = "TrustAnnotations"
git = "https://github.com/LeanTrustBuilders/annotations"
# Like MeaningGraph: `main` follows the newest toolchain, `lean-v<toolchain>` older ones.
rev = "main"

# The well-definedness analyzer, for `trust-extract welldefined`.
[[require]]
name = "WellDefined"
git = "https://github.com/LeanTrustBuilders/well-defined"
rev = "main"


[[lean_lib]]
name = "TrustExtractor"

[[lean_exe]]
name = "trust-extract"
root = "Main"
supportInterpreter = true
