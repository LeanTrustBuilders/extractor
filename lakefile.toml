name = "TrustExtractor"
version = "0.1.0"
defaultTargets = ["trust-extract"]

# Dependency analysis: the notions of dependency (statement, meaning, term) come from here.
[[require]]
name = "MeaningGraph"
git = "https://github.com/LeanTrustBuilders/meaning-graph"
# The branch carrying the current code on this toolchain (main follows the newest one).
rev = "lean-v4.34.0"

[[require]]
name = "semantic_hash"
git = "https://github.com/mathlib-initiative/semantic_hash"
rev = "0496f6d7b650cb03c9ffc61089ffd400dfd98564"

[[require]]
name = "TrustAnnotations"
git = "https://github.com/LeanTrustBuilders/annotations"
# The annotations package is tagged by toolchain, like this one.
rev = "v4.34.0"

[[lean_lib]]
name = "TrustExtractor"

[[lean_exe]]
name = "trust-extract"
root = "Main"
supportInterpreter = true
