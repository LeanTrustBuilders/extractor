name: Release

# A release is cut per extractor version and Lean toolchain: the tag names both, the toolchain being
# the one the binary reads `.olean` files of (`v0.2.0-lean-v4.34.0`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
      - name: The tag names the version and the pinned toolchain
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          toolchain=$(sed 's/.*:v//' lean-toolchain)
          version=$(sed -n 's/^def extractorVersion : String := "\(.*\)"$/\1/p' TrustExtractor/Extract.lean)
          python3 scripts/check-pins.py "$toolchain"
          # Tags are v<extractor version>-lean-v<toolchain>, e.g. v0.2.0-lean-v4.34.0-rc2.
          [ "$GITHUB_REF_NAME" = "v$version-lean-v$toolchain" ] || {
            echo "tag $GITHUB_REF_NAME should be v$version-lean-v$toolchain"; exit 1; }
      - name: Fixture test
        run: test/run.sh
      - name: Package
        run: |
          mkdir -p dist/trust-extract
          cp .lake/build/bin/trust-extract lean-toolchain LICENSE README.md scripts/examples.py dist/trust-extract/
          tar -C dist -czf trust-extract-linux-x86_64.tar.gz trust-extract
          sha256sum trust-extract-linux-x86_64.tar.gz > SHA256SUMS
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" trust-extract-linux-x86_64.tar.gz SHA256SUMS \
            --title "trust-extract ${GITHUB_REF_NAME%%-lean-*} for $(cat lean-toolchain)" \
            --notes "trust-extract built for \`$(cat lean-toolchain)\`. Run it under \`lake env\` in a project on the same toolchain." \
            || gh release upload "$GITHUB_REF_NAME" trust-extract-linux-x86_64.tar.gz SHA256SUMS --clobber
